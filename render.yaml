services:
  - type: web
    name: jobify-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    # postinstall runs `prisma generate`; migrate deploy applies committed
    # migrations to the Supabase database before the service starts.
    buildCommand: npm install && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production

      # Generated once by Render and kept secret.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      # Set these in the Render dashboard after the first deploy.
      #   DATABASE_URL -> Supabase pooled connection string (port 6543)
      #   DIRECT_URL   -> Supabase direct connection string (port 5432)
      #   CLIENT_URL   -> your Vercel URL (comma-separated for several origins)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLIENT_URL
        sync: false
